name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vrms-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vrms-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1. BUILD & PUSH BACKEND (Spring Boot) ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Spring Boot JAR
        run: |
          cd vrms
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Build & Push VRMS Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./vrms
          file: ./vrms/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      # --- 2. BUILD & PUSH FRONTEND (Flutter Web) ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build Flutter Web Release
        run: |
          cd vehicle_rental
          flutter pub get
          flutter build web --release

      - name: Build & Push VRMS Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./vehicle_rental/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to Kubernetes Cluster
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap-secret.yaml
          kubectl apply -f k8s/mysql.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update Deployments to Newly Built Images
        run: |
          kubectl set image deployment/vrms-backend backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n vrms
          kubectl set image deployment/vrms-frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -n vrms

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/vrms-backend -n vrms --timeout=180s
          kubectl rollout status deployment/vrms-frontend -n vrms --timeout=180s

