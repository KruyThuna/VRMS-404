services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: VRMS-DB
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vrms_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345}
    ports:
      # Localhost connection port to MySQL (3307 on host avoids conflict with Windows MySQL 3306)
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./vrms_db.sql:/docker-entrypoint-initdb.d/01_vrms_db.sql:ro
    networks:
      - vrms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-12345}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. VRMS Backend Service
  vrms:
    build:
      context: ./vrms
      dockerfile: Dockerfile
    image: vrms-404:latest
    container_name: VRMS-Backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Port for Backend Spring Boot server
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-vrms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    networks:
      - vrms-network

volumes:
  mysql_data:

networks:
  vrms-network:
    driver: bridge