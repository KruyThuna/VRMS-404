apiVersion: v1
kind: ConfigMap
metadata:
  name: vrms-config
  namespace: vrms
data:
  MYSQL_DATABASE: "vrms_db"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/vrms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: vrms-secrets
  namespace: vrms
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_PASSWORD"

